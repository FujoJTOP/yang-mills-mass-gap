<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>Clay 证明结构 · 3D</title>
<style>
  :root{
    --bg:#08090c; --ink:#e8e4dc; --dim:#7d7870;
    --ok:#6fd39a; --no:#f0785f; --half:#e8c46a; --ev:#c9a35e; --tg:#f0b27a; --zero:#4a5058;
    --mono:ui-monospace,"SF Mono",JetBrains Mono,Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif CJK SC",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--serif)}
  #c{display:block;width:100vw;height:100vh;outline:none}
  .panel{position:fixed;pointer-events:none;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--dim)}
  #tl{top:26px;left:30px} #bl{bottom:22px;left:30px} #br{bottom:22px;right:30px;text-align:right}
  h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 3px;color:#f4f0e8}
  .sub{font-size:10.5px;color:#5d5a54;margin:0 0 16px;letter-spacing:.04em}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .k{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .k.ok{background:var(--ok);box-shadow:0 0 10px #6fd39a88}
  .k.half{background:var(--half);box-shadow:0 0 12px #e8c46aaa}
  .k.no{background:var(--no);box-shadow:0 0 10px #f0785f99}
  .k.ev{background:var(--ev);box-shadow:0 0 8px #c9a35e77}
  .k.tg{background:var(--tg);box-shadow:0 0 12px #f0b27aaa}
  .k.zero{background:var(--zero);box-shadow:0 0 6px #4a505866}
  .num{color:#b9b3a8}
  .sep{height:1px;background:linear-gradient(90deg,#23262d,transparent);margin:12px 0 10px;width:168px}
  .tiny{font-size:10px;color:#4e4b46;line-height:1.7}
  #tip{position:fixed;pointer-events:none;max-width:340px;padding:10px 13px;
       background:#101218f2;border:1px solid #2a2e37;border-left-width:2px;border-radius:4px;
       font-family:var(--mono);font-size:11px;line-height:1.65;color:#cdc8bf;
       opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;z-index:9;backdrop-filter:blur(6px)}
  #tip.on{opacity:1;transform:translateY(0)}
  #tip .t{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
  #tip .g{display:block;font-size:9.5px;color:#6b6760;margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
  #fb{display:none;position:fixed;inset:0;padding:44px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.9;color:#cdc8bf;background:var(--bg)}
  #fb pre{white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel" id="tl">
  <h1>Clay 证明结构</h1>
  <p class="sub">4D 纯 SU(N) 质量间隙 · 第 247 轮</p>
  <div id="stat"></div>
  <div class="sep"></div>
  <div class="row"><i class="k no"></i><span>全关</span></div>
  <div class="row"><i class="k half"></i><span>半开（差一条不等式）</span></div>
  <div class="row"><i class="k ok"></i><span>已证 [T]</span></div>
  <div class="row"><i class="k ev"></i><span>仅读数 [E]</span></div>
  <div class="row"><i class="k tg"></i><span>目标</span></div>
  <div class="row"><i class="k zero"></i><span>零代价（不计缺件）</span></div>
</div>
<div class="panel" id="bl">
  拖动旋转 · 滚轮缩放 · 悬停看细节<br>
  <span class="tiny">Clay 未证。无百分比。</span>
</div>
<div class="panel" id="br"><span class="tiny" id="fps"></span></div>
<div id="tip"></div>
<div id="fb"><pre id="fbt"></pre></div>

  { id:'l3',  label:'L3   δ > 0', s:'no', r:5.2, L:1, w:2.0,

  { id:'z3', label:'Δ_a > 0（固定 L,a）  [T]', s:'zero', r:10.8, L:2, w:0.6,

  { id:'cellb', label:'ϖ ≥ v(β) = 6.42e−3', s:'ok', r:15.6, L:3, w:0.8,

const HEX = s => '#' + C[s].toString(16).padStart(6,'0');
const TAG = { ok:'已证 [T]', no:'全关', half:'半开', ev:'仅读数 [E]', tgt:'目标', zero:'零代价 / 不单列' };

const P = {}, byLayer = {};
N.forEach(n => (byLayer[n.L] ||= []).push(n));
N.forEach(n => {
  const arr = byLayer[n.L], i = arr.indexOf(n), k = arr.length;

import * as THREE from 'three';

/* 星尘 */
{
  const n=1800, pos=new Float32Array(n*3), col=new Float32Array(n*3);

[5.2,10.8,15.6,19.8].forEach(r => {

function glowTex(hex, soft){
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const g=cv.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0, hex+(soft?'99':'dd'));
  gr.addColorStop(0.28, hex+(soft?'33':'55'));
  gr.addColorStop(1, hex+'00');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
}

function label(text, hex, scale){
  const fs=46, pad=22;
  const m=document.createElement('canvas').getContext('2d');
  m.font=`600 ${fs}px "SF Mono", Menlo, Consolas, monospace`;
  const w=Math.ceil(m.measureText(text).width);
  const cv=document.createElement('canvas'); cv.width=w+pad*2; cv.height=fs+pad*2;
  const g=cv.getContext('2d');
  g.font=`600 ${fs}px "SF Mono", Menlo, Consolas, monospace`;
  g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor='rgba(0,0,0,0.98)'; g.shadowBlur=16;
  g.fillStyle=hex; g.fillText(text, cv.width/2, cv.height/2);
  const tex=new THREE.CanvasTexture(cv); tex.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,depthTest:false}));
  const k=0.0106*(scale||1);
  sp.scale.set(cv.width*k, cv.height*k, 1); sp.renderOrder=10;
  return sp;
}

const O = {};
N.forEach((n, idx) => {
  const p=P[n.id], col=C[n.s], hex=HEX(n.s);
  const isT=n.s==='tgt', isZ=n.s==='zero';

  const mesh=new THREE.Mesh(new THREE.SphereGeometry(rad,32,24),
    new THREE.MeshStandardMaterial({ color:col, emissive:col,
      emissiveIntensity: isZ?0.22:(n.s==='no'?0.9:(n.s==='half'?0.85:0.55)),
      roughness:0.28, metalness:0.1 }));
  mesh.position.set(p[0],p[1],p[2]); scene.add(mesh);

  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(hex,isZ),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  halo.scale.setScalar(SIZE[n.s]*(isZ?0.75:1)); halo.position.copy(mesh.position); scene.add(halo);

  const lab=label(n.label, hex, isT?1.2:(isZ?0.85:1.0));
  lab.position.set(p[0], p[1]+(isT?2.4:(isZ?0.95:1.5)), p[2]); scene.add(lab);

  let ring=null;
  if (n.s==='no'||n.s==='half'||n.s==='tgt'){
    ring=new THREE.Mesh(new THREE.RingGeometry(rad*1.55,rad*1.72,64),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.3,side:THREE.DoubleSide,depthWrite:false}));
    ring.position.copy(mesh.position); ring.lookAt(camera.position); scene.add(ring);
  }
  O[n.id]={mesh,halo,lab,ring,d:n,baseY:p[1],rad,idx};
});

/* 边 */
const edges=[];
E.forEach(([a,b]) => {
  const pa=new THREE.Vector3(...P[a]), pb=new THREE.Vector3(...P[b]);
  const mid=pa.clone().add(pb).multiplyScalar(0.5);
  mid.y += 1.4 + pa.distanceTo(pb)*0.11;
  const curve=new THREE.QuadraticBezierCurve3(pa,mid,pb);
  const pts=curve.getPoints(48);
  const ca=new THREE.Color(C[O[a].d.s]), cb=new THREE.Color(C[O[b].d.s]);
  const cols=[];
  pts.forEach((_,i)=>{const t=i/(pts.length-1); const c=ca.clone().lerp(cb,t); cols.push(c.r,c.g,c.b);});
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.6,depthWrite:false})));
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(HEX(O[b].d.s),true),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  sp.scale.setScalar(0.7); scene.add(sp);
  edges.push({curve,sp,t:Math.random(),v:0.085+Math.random()*0.13});
});

/* 统计 */
{
  const c={ok:0,no:0,half:0,ev:0,tgt:0,zero:0};
  N.forEach(n=>c[n.s]++);
  document.getElementById('stat').innerHTML =
    `<span class="num">${N.length}</span> 节点 · <span class="num">${E.length}</span> 边<br>` +
    `全关 <span class="num" style="color:#f0785f">${c.no}</span> · ` +
    `半开 <span class="num" style="color:#e8c46a">${c.half}</span> · ` +
    `已证 <span class="num" style="color:#6fd39a">${c.ok}</span><br>` +
    `读数 <span class="num">${c.ev}</span> · ` +
    `零代价 <span class="num">${c.zero}</span> · ` +
    `目标 <span class="num">${c.tgt}</span>`;
}

/* 交互 */
const ray=new THREE.Raycaster(), mo=new THREE.Vector2(-9,-9);
const tip=document.getElementById('tip');
let hov=null;
addEventListener('pointermove', e => {
  mo.x=(e.clientX/innerWidth)*2-1; mo.y=-(e.clientY/innerHeight)*2+1;
  tip.style.left=Math.min(e.clientX+18, innerWidth-358)+'px';
  tip.style.top=Math.min(e.clientY+18, innerHeight-180)+'px';
});
function pick(){
  ray.setFromCamera(mo,camera);
  const list=N.map(n=>O[n.id].mesh);
  const hit=ray.intersectObjects(list,false)[0];
  const id=hit?N[list.indexOf(hit.object)].id:null;
  if(id===hov) return;
  hov=id;
  if(id){
    const d=O[id].d;
    tip.innerHTML=`<span class="t" style="color:${HEX(d.s)}">${d.label}</span>`+
                  `<span class="g">${TAG[d.s]}</span>${d.note}`;
    tip.style.borderLeftColor=HEX(d.s);
    tip.classList.add('on'); document.body.style.cursor='pointer';
  } else { tip.classList.remove('on'); document.body.style.cursor=''; }
}

/* 动画 */
const clock=new THREE.Clock();
let intro=0, acc=0, frames=0;
const fpsEl=document.getElementById('fps'), tmpV=new THREE.Vector3();
function loop(){
  const t=clock.getElapsedTime();
  const dt=Math.min(clock.getDelta?0.05:0.016,0.05);
  if(intro<1){
    intro=Math.min(1,intro+dt*0.7);
    const e=1-Math.pow(1-intro,3);
    camera.position.lerpVectors(HOME.clone().multiplyScalar(2.6), HOME, e);
  }
  N.forEach((n,i)=>{
    const o=O[n.id];
    const ph=t*(n.s==='no'?1.7:(n.s==='half'?1.35:1.0))+i*0.83;
    const amp=n.s==='no'?0.15:(n.s==='half'?0.13:(n.s==='tgt'?0.08:0.05));
    o.halo.scale.setScalar(SIZE[n.s]*(n.s==='zero'?0.75:1)*(1+amp*Math.sin(ph)));
    if(n.s==='no'||n.s==='half') o.mesh.material.emissiveIntensity=0.68+0.42*Math.sin(ph);
    o.mesh.position.y=o.baseY+Math.sin(t*0.62+i*0.9)*0.20;
    o.halo.position.y=o.mesh.position.y;
    o.lab.position.y=o.mesh.position.y+(n.s==='tgt'?2.4:(n.s==='zero'?0.95:1.5));
    if(o.ring){
      o.ring.position.y=o.mesh.position.y; o.ring.lookAt(camera.position);
      o.ring.scale.setScalar(1+0.22*Math.sin(ph*1.15));
      o.ring.material.opacity=0.12+0.20*(0.5+0.5*Math.sin(ph*1.15));
    }
    const target=(hov===n.id)?1.42:1.0, cur=o.mesh.scale.x;
    o.mesh.scale.setScalar(cur+(target-cur)*0.16);
  });
  edges.forEach(e=>{
    e.t+=e.v*dt*1.6; if(e.t>1) e.t-=1;
    e.curve.getPoint(e.t,tmpV); e.sp.position.copy(tmpV);
    e.sp.scale.setScalar(0.48+0.34*Math.sin(t*3.6+e.t*8));
  });
  fill.position.set(Math.cos(t*0.33)*18, -8+Math.sin(t*0.21)*6, Math.sin(t*0.33)*18);
  pick(); ctl.update(); renderer.render(scene,camera);
  frames++; acc+=dt;
  if(acc>0.6){ fpsEl.textContent=`${Math.round(frames/acc)} fps`; frames=0; acc=0; }
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
