# Design for the standalone package.  Building it needs the full mathlib build
# (v4.33.0-rc1); this session compiled each module directly against the olean cache
# instead, because a full `lake build` was out of scope.
name = "yangMillsInfra"
defaultTargets = ["YangMillsInfra"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "YangMillsInfra"
